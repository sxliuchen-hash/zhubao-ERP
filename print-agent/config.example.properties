# 复制为 print-agent.properties，和 ZhubaoPrintReceiver.exe 放在同一目录，不要提交真实凭据。
# 在接了标签机的电脑上双击 ZhubaoPrintReceiver.exe。
# stationId、token 来自标签页保存工位时显示的一次凭据；queue 后面的 ID 必须与页面上的队列 ID 一致。
# 打印机名称必须与 Windows「打印机和扫描仪」中的全名一致。同一工位不要同时运行 Java 打印程序。
baseUrl=https://erp.example.com
stationId=liuchen
token=请换成工位凭据
queue.liuchen=请换成 Windows 打印队列名称
# 测试地址证书不被系统信任时才改为 true。正式环境不要打开。
# allowUntrustedCertificate=false
