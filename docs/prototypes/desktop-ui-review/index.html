function orderRows(){const items=listItems();return items.length?items.map(x=>`<tr data-order="${x.index}" class="${state.selected===x.index?'selected':''}" aria-selected="${state.selected===x.index}"><td><input type="checkbox" data-check="${x.index}" aria-label="选择 ${x.id}" ${state.checked.has(x.index)?'checked':''}></td><td><strong>${x.name}</strong><small class="code">${x.id}</small></td><td>${x.customer}<small>${x.material}</small></td><td>${x.process}<small>${x.worker}</small></td><td><span class="progress"><span class="track"><span style="width:${x.percent}%"></span></span>${x.percent}%</span></td><td>${x.date.slice(5)}<small>${x.date==='2026-10-23'?'今天交付':x.date==='2026-10-24'?'明天交付':'待到期'}</small></td><td>${tag(x.status,tone(x.status))}</td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">没有符合条件的订单<br>试试调整搜索或筛选条件</div></td></tr>`}
function ordersView(){const production=state.screen==='production',quality=state.screen==='quality';const title=production?'生产作业':quality?'质量作业':'订单中心';return header(title,production?'聚焦本岗工序；更新进度与正式交工分别确认。':quality?'待检、返工与复检集中查看；判定与放行分阶段办理。':'来料、母单、子单与在制进度，一处查找，单内办理。',`${btn(icon('tag')+' 标签记录','print-records')}${role().intake?btn(icon('plus')+' 新建收货','intake','primary'):''}`,'生产协同 / '+title)+`<div class="split ${state.selected===null?'closed':''}"><section class="card flush"><div class="tabs">${listTabs().map(([k,t])=>`<button class="tab ${state.tab===k?'active':''}" data-action="list-tab:${k}">${t}</button>`).join('')}</div><div class="filters"><label class="search-input">${icon('search')}<input id="order-query" placeholder="单号、运单、客户或货品" aria-label="订单搜索" value="${escape(state.query)}"></label><select id="customer-filter" aria-label="按客户筛选"><option value="">全部客户</option>${['锦和珠宝','云璟玉器','远山玉坊'].map(x=>`<option ${state.customer===x?'selected':''}>${x}</option>`).join('')}</select><select id="process-filter" aria-label="按工序筛选"><option value="">全部工序</option>${['雕刻','镶嵌','抛光'].map(x=>`<option ${state.process===x?'selected':''}>${x}</option>`).join('')}</select><button class="text-btn" data-action="more-filter">${icon('filter')} 筛选</button></div><div id="batch-bar">${batchBar()}</div><div class="table-scroll"><table class="order-table"><thead><tr><th><input type="checkbox" id="check-all" aria-label="选择当前列表全部订单" ${listItems().length&&listItems().every(x=>state.checked.has(x.index))?'checked':''}></th><th>货品 / 单号</th><th>客户 / 材质</th><th>工序 / 责任人</th><th>工序进度</th><th>交期</th><th>状态</th></tr></thead><tbody id="order-rows">${orderRows()}</tbody></table></div><div class="table-footer"><span id="order-count">共 ${listItems().length} 张可见单据 · 当前页全部显示</span><div class="pagination"><button disabled aria-label="上一页">‹</button><button class="active" aria-current="page">1</button><button disabled aria-label="下一页">›</button></div></div></section>${state.selected!==null?inspector():''}</div>`+footer('选择列表只查看详情，所有业务提交仍需明确确认')}
function batchBar(){return state.checked.size?`<div class="batch-bar"><span>已选 ${state.checked.size} 张单据</span><div class="actions"><button class="text-btn" data-action="batch-label">预览标签</button><button class="text-btn" data-action="export">导出所选</button><button class="text-btn" data-action="clear-checked">取消选择</button></div></div>`:''}
function refreshRows(){const el=$('order-rows');if(!el)return;if(state.selected!==null&&!listItems().some(x=>x.index===state.selected)){const active=document.activeElement?.id;const cursor=$('order-query')?.selectionStart;state.selected=null;renderMain();if(active==='order-query'){$('order-query').focus();$('order-query').setSelectionRange(cursor,cursor)}return;}el.innerHTML=orderRows();$('order-count').textContent=`共 ${listItems().length} 张可见单据 · 当前页全部显示`;$('batch-bar').innerHTML=batchBar();$('check-all').checked=!!listItems().length&&listItems().every(x=>state.checked.has(x.index))}
function inspector(expanded=false){const x=order();return `<aside class="card flush inspector"><div class="inspector-top"><div class="spread">${tag(x.status,tone(x.status))}<div class="actions">${expanded?'':`<button class="icon-btn" data-action="expand-detail" aria-label="展开完整详情">${icon('expand')}</button><button class="icon-btn" data-action="close-inspector" aria-label="收起详情">${icon('close')}</button>`}</div></div><h2>${x.name}</h2><p class="caption code">${x.id.startsWith('RW-')?'执行轮次':x.id===x.mother?'母单':'子单'} ${x.id}</p><p class="caption code">母单 ${x.mother} · 有效版本 V2</p><div class="detail-stats"><div><small>本单数量</small>${x.qty}<em>件</em></div><div><small>来料重量</small>${x.weight}<em>克</em></div><div><small>交期</small>${x.date.slice(5)}</div></div></div><div class="tabs">${[['overview','概况'],['progress','流转'],['evidence','附件 · 3']].map(([k,l])=>`<button class="tab ${state.detailTab===k?'active':''}" data-action="detail-tab:${k}">${l}</button>`).join('')}</div><div class="inspector-body">${state.detailTab==='overview'?`<section><h3 class="block-title">当前加工要求</h3><p class="mini-label">${x.id.startsWith('RW-')?'本轮次要求':'子单要求'} · ${x.process}</p><p class="requirement">边缘圆顺，表面细抛光；孔口无崩边，保留原料纹理。</p><p class="mini-label" style="margin-top:14px">母单要求 · V2</p><p class="requirement">按客户样板加工，成品尺寸一致，逐件留证后交付。</p><div class="divider"><div class="spread"><h3 class="block-title" style="margin:0">${x.process}</h3><span class="caption">${x.percent}%</span></div><div class="track" style="width:100%;margin:13px 0 8px"><span style="width:${x.percent}%"></span></div><p class="note-line">${x.worker} · 今天 10:36 更新<br>工序进度不代替正式交工</p></div></section><section class="divider"><h3 class="block-title">订单资料</h3><div class="detail-facts">${state.role!=='operator'?`<div><small>客户</small>${x.customer}</div>`:''}<div><small>材质</small>${x.material}</div><div><small>当前位置</small>${x.warehouse}</div><div><small>来源运单</small>SF13800138206</div></div></section>`:state.detailTab==='progress'?timeline():attachments()}</div><div class="inspector-footer">${btn(icon('more')+' 更多','order-actions')}${primaryAction()}</div></aside>`}
function primaryAction(){const x=order();if(x.status==='待发货'&&role().ship)return btn('办理发货','shipping','primary');if(x.status==='待质检'&&role().inspect)return btn('开始质检','quality-form','primary');if(x.status==='待拆单'&&role().intake)return btn('确认与拆单','split','primary');if(role().report&&['加工中','待开工','返工中'].includes(x.status))return btn('办理本工序','production-form','primary');if(allowed('finance'))return btn('查看客户账单','bill','primary');return btn('查看流转记录','open-timeline','primary')}

{items[state.stockIndex]?.[0]||items[0][0]}</h2><p class="caption">${items[state.stockIndex]?.[1]||items[0][1]} · ${company?'公司所有':items[state.stockIndex]?.[2]||items[0][2]}</p><div class="divider"><h3 class="block-title">最近出入库记录</h3><div class="timeline"><div class="event current"><strong>${company?(state.stockIndex===1?'入库 120 颗':'领用 60.5 克'):prep?'寄存入库':'质检放行入库'}</strong><small>今天 10:20 · ${company?(state.stockIndex===1?'陈师傅 · 用途：镶嵌备料':'李师傅 · 用途：车间抛光'):'陈师傅 · 原单据可追溯'}</small></div><div class="event"><strong>${company?(state.stockIndex===1?'批次建立':'入库 560.5 克'):'收货登记'}</strong><small>昨天 09:30 · 陈师傅<br>${company?(state.stockIndex===1?'批次 CL-028':'批次 CL-026'):'保留客户与来源明细归属'}</small></div></div></div><div class="divider">${btn(company?'登记领用':prep?'用此备料建单':state.stockIndex===0?'办理本批次发货':'查看关联订单',company?'stock-issue':prep?'prep-order':state.stockIndex===0?'shipping':'open-order:'+(state.stockIndex===1?0:1),'primary full')}</div><p class="caption" style="margin-top:13px">${company?'领用不并入客户料，也不自动完成成本核销。':prep?'备料转加工时核对归属与可用量，生成正式业务单据。':'发货先选择完整库存，核对本次数量、重量与物流。'}</p></aside></div>`+footer()}

ead"><div><p class="caption">2026年10月未收</p><p class="amount">¥ ${money('18,600.00')}</p></div>${btn('打开账单并登记收款','bill','primary')}</div>`}</div></section></div>`+footer()}

document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button&&!button.disabled){dispatch(button.dataset.action,button);return}if(event.target.closest('input'))return;const tr=event.target.closest('[data-order]');if(tr){select(tr.dataset.order);return}const stock=event.target.closest('[data-stockrow]');if(stock){state.stockIndex=Number(stock.dataset.stockrow);renderMain()}});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.check!==undefined){const i=Number(el.dataset.check);if(el.checked)state.checked.add(i);else state.checked.delete(i);refreshRows()}if(el.id==='check-all'){listItems().forEach(x=>el.checked?state.checked.add(x.index):state.checked.delete(x.index));refreshRows()}if(el.id==='customer-filter'||el.id==='process-filter'){state[el.id==='customer-filter'?'customer':'process']=el.value;state.checked.clear();refreshRows()}if(el.id==='role-select'){state.role=el.value;state.selected=state.role==='quality'?1:0;state.customerTab='orders';state.judges={};state.intake=null;go('home')}if(el.name==='purpose'){saveIntake();intakeForm()}if(el.name==='requirementTemplate'){const text=document.querySelector('[name=requirement]');if(text&&confirm('套用模板会替换当前最终加工要求，是否继续？')){text.value=el.value==='素面精抛 · V2'?'表面精抛，边缘圆顺，保留素面纹理。':el.value==='自定义要求'?'':'边缘圆顺，表面细抛光；孔口无崩边，按客户样板加工。';saveIntake()}}});
