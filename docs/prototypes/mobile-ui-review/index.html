function production(){if(state.submitted)return success(state.prod==='progress'?'进度已记录':'本工序已正式交工',o().code,state.prod==='progress'?`${state.percent}% 仅记录本工序进度，未触发质检或库存转移。`:'已模拟完成本工序交付，后续由质检岗位检验。',button('返回订单','go:detail','primary full'));return `<div class="page"><div class="card"><div class="spread"><strong style="font-size:14px">${o().name}</strong><span class="tag">${o().process}</span></div><p class="caption mono" style="margin-top:8px">${o().code}</p></div><div class="tabs">${[['progress','更新进度'],['handoff','正式交工']].map(([k,l])=>`<button class="chip ${state.prod===k?'active':''}" data-action="prod-tab:${k}">${l}</button>`).join('')}</div><div class="card"><h3 class="block-title">本岗位加工要求</h3><p class="requirement">边缘圆顺，表面细抛光；孔口无崩边，保留原料纹理。</p><details><summary>查看母单要求</summary><p class="requirement">按客户样板加工，成品尺寸一致，逐件留证后交付。</p></details></div>${state.prod==='progress'?`<div class="card"><h3 class="block-title">本工序完成进度</h3><div class="choice-row">${[0,30,60,90,100].map(x=>button(x+'%','percent:'+x,state.percent===x?'selected':'')).join('')}</div><label class="field"><span>进度说明 · 可选</span><textarea placeholder="记录目前做到哪一步"></textarea></label>${state.percent<o().percent?field('回退原因 · 必填','','text','rollbackReason'):''}<p class="notice">100% 表示工序进度已完成。核对要求后，仍需切换到「正式交工」办理交付。</p></div><button class="btn full" data-action="progress-history">${icon('clock')} 查看本工序进度历史</button>`:`<div class="card"><h3 class="block-title">核对本次交工</h3><label class="check-line"><input type="checkbox" name="reviewed">我已逐条核对本岗位加工要求</label><div class="two-col" style="margin-top:15px">${field('交工数量（件）',o().qty,'number','handoffQty')}${field('交工重量（克）',o().weight,'number','handoffWeight')}</div><p class="caption">操作人：当前登录账号 · ${r().person}师傅</p></div><div class="card"><h3 class="block-title">工序证据</h3><div class="upload-row">${button(icon('photo')+' 拍照','capture')}${button(icon('clip')+' 选文件','capture')}</div></div><p class="notice warning">确认后进入正式交付流程。重复操作沿用同一请求编号。</p>`}</div>`}
function quality(){const values=Object.values(state.quality),all=values.length===3,failed=values.includes('fail');if(state.submitted)return success(failed?'已提交不合格结果':'逐条质检已提交',o().code,failed?'本轮已冻结。返工、复检和放行需要按后续状态分别办理。':'本轮判定合格。放行仍需独立确认。',`${button(failed?'开立返工单':'确认放行',failed?'rework':'release','primary full')}${button('返回订单','go:detail','full')}`);return `<div class="page"><div class="card"><div class="spread"><strong style="font-size:14px">${o().name}</strong><span class="tag gold">待质检</span></div><p class="caption mono" style="margin-top:8px">${o().code} · 当前轮次</p></div><div class="spread" style="margin:19px 0 12px"><h3 class="block-title" style="margin:0">逐条核对加工要求</h3><span class="caption">已判 ${values.length} / 3</span></div><div class="card">${['表面细抛光，无明显划痕','边缘圆顺，孔口无崩边','尺寸与客户样板一致'].map((x,i)=>`<div class="check-line"><span style="color:#a0aa98">0${i+1}</span><span>${x}</span><span class="judgement"><button data-action="judge:${i}:pass" class="${state.quality[i]==='pass'?'selected':''}">合格</button><button data-action="judge:${i}:fail" class="${state.quality[i]==='fail'?'selected fail':''}">不合格</button></span></div>`).join('')}</div>${failed?`<div class="card"><h3 class="block-title">异常说明</h3><label class="field"><span>缺陷描述 · 必填</span><textarea name="defect" placeholder="说明位置、数量与缺陷情况"></textarea></label><p class="notice warning">提交后冻结本轮，再按结果开立返工，不能跳过复检直接放行。</p></div>`:''}<div class="card"><h3 class="block-title">检验现场证据</h3><div class="upload-row">${button(icon('photo')+' 拍照','capture')}${button(icon('video')+' 录像','capture')}</div><p class="caption" style="margin-top:10px">质检员：${r().person}师傅 · 当前登录账号</p></div><button class="text-btn" data-action="quality-note">只记录质检过程说明</button><p class="caption">过程说明单独保存，不替代正式检验结果。</p>${all?`<p class="notice ${failed?'warning':''}" style="margin-top:15px">本次判定：${failed?'不合格，冻结后处理':'全部合格，提交后可办理独立放行'}</p>`:''}</div>`}
function shipping(){if(state.submitted)return success('发货已确认','FH-20261023-005','12 件 · 86.2 克 · 顺丰速运<br>发货记录已模拟生成，可继续补充发货证据。',`${button('查看发货证据','shipping-evidence','primary full')}${button('返回订单','go:detail','full')}`);return `<div class="page"><div class="card"><div class="spread"><strong style="font-size:14px">青玉吊坠</strong><span class="tag">质检已放行</span></div><p class="caption" style="margin-top:8px">锦和珠宝 · GD-20261023-014</p></div>${section('选择可发货库存')}<button class="card order-card" style="${state.stockSelected?'border-color:#93b49c;background:#f1f6ed':''}" data-action="select-shipping-stock"><div class="spread"><strong style="font-size:12px">成品库 · A-03</strong><span class="tag ${state.stockSelected?'':'gray'}">${state.stockSelected?'已选定':'点击选择'}</span></div><p class="caption" style="margin-top:9px">批次 PC-014 · 和田青玉 · 12 件 / 86.2 克</p><p class="caption">库存归属：客户加工料 · 锦和珠宝</p></button>${state.stockSelected?`<div class="card"><h3 class="block-title">本次发货</h3><div class="two-col">${field('数量（件）','12','number','shipQty')}${field('重量（克）','86.2','number','shipWeight')}</div><label class="field"><span>物流方式</span><select aria-label="物流方式"><option>顺丰速运</option><option>客户自提</option><option>其他物流</option></select></label><label class="field"><span>物流单号 · 按物流方式核对</span><div class="search"><input name="shipWaybill" aria-label="发货物流单号" placeholder="输入或扫描物流单号"><button data-action="shipping-scan">${icon('scan')}</button></div></label></div><div class="card"><h3 class="block-title">装箱证据</h3><div class="upload-row">${button(icon('photo')+' 拍照','capture')}${button(icon('video')+' 录像','capture')}</div></div>`:`<p class="notice">先核对并选择完整库存。存在多条库存时逐条选择，不默认替选。</p>`}</div>`}

 · 示例口径</p><div class="card" style="margin-top:15px"><p class="mini-label">已入账加工收入</p><p class="amount">${state.financeHidden?'••••':'¥ 46,800.00'}</p><p class="caption" style="margin-top:14px">按账务口径展示趋势与明细；成本和经营结余分别核对。</p></div>${row('查看收入明细','逐笔追溯原单','customer-bill','finance')}`],'finance-filter':['账单筛选',`${field('账期','2026-10','month')}<label class="field"><span>状态</span><select><option>未收清</option><option>已收清</option><option>全部</option></select></label>${button('应用筛选','demo-save','primary full')}`]};if(extra[cmd]){showSheet(...extra[cmd]);return}if(cmd==='demo-read'){toast('已展示管理入口，真实数据需从对应接口读取');return}if(cmd==='demo-logout'){state.overlay=null;go('more');toast('退出流程演示完成');return}toast('该操作为展示范围内的入口示意')}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el&&!el.disabled)dispatch(el.dataset.action,el)});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='order-search'){$('order-list').innerHTML=orderRows(el.value.trim());updateOrderCount()}if(el.id==='stock-search'||el.id==='customer-search'){const list=$(el.id==='stock-search'?'stock-list':'customer-list');if(list)Array.from(list.children).forEach(x=>x.hidden=!x.textContent.includes(el.value.trim()))}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.overlay){state.overlay=null;renderOverlay()}if(event.key==='Enter'&&event.target.id==='home-search'){go('orders');$('order-search').value=event.target.value;$('order-list').innerHTML=orderRows(event.target.value);updateOrderCount()}if(event.key==='Enter'&&event.target.id==='manual-code')dispatch('manual-lookup')});
document.addEventListener('change',event=>{if(event.target.id==='source-select'){state.intakeSource=event.target.value;render()}if(event.target.id==='template-select'){if(confirm('套用模板会替换当前最终要求，是否继续？'))$('final-requirement').value=event.target.value==='素面精抛 · V2'?'表面精抛，边缘圆顺，保持素面纹理。':event.target.value==='自定义要求'?'':'边缘圆顺，表面细抛光；孔口无崩边，按客户样板加工。'}});

function fieldKey(el){
  if(!el.closest('.field'))return null;
  const scope=el.closest('.sheet')?'弹层:'+state.overlay?.title:state.screen;
  const key=el.name||el.id||el.getAttribute('aria-label')||el.closest('.field').querySelector('span')?.textContent.trim();
  return key?scope+':'+key:null;
}
document.addEventListener('input',event=>{const key=fieldKey(event.target);if(key)formCache.set(key,event.target.value)});
document.addEventListener('change',event=>{const key=fieldKey(event.target);if(key)formCache.set(key,event.target.value)});
new MutationObserver(()=>{
  document.querySelectorAll('.field input,.field select,.field textarea').forEach(el=>{const key=fieldKey(el);if(key&&formCache.has(key))el.value=formCache.get(key)});
}).observe($('device'),{childList:true,subtree:true});

const roleOptions=Object.entries(roles).map(([key,value])=>`<option value="${key}">${value.name}</option>`).join('');$('role-select').innerHTML=roleOptions;$('mobile-role').innerHTML=roleOptions;
function changeRole(event){formCache.clear();state.role=event.target.value;$('role-select').value=state.role;$('mobile-role').value=state.role;state.order=state.role==='quality'?1:state.role==='warehouse'?2:0;state.overlay=null;state.screen='home';state.submitted=false;state.quality={};render();$('app-scroll').scrollTop=0}
$('role-select').addEventListener('change',changeRole);$('mobile-role').addEventListener('change',changeRole);$('width-select').addEventListener('change',event=>{$('device').style.width=`min(100%,${event.target.value}px)`});
render();
})();
</script>
