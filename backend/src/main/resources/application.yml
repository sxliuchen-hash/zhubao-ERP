server:
  port: 8080

spring:
  application:
    name: zhubao-erp-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info

zhubao:
  m0:
    storage-mode: nas-first
    video-buffer-seconds: 5
    max-video-retry: 3
  documents:
    repository: memory
    storage:
      provider: local
      local-root: target/zhubao-evidence
  operations:
    frontend-url: ${ZHUBAO_FRONTEND_URL:http://localhost:5173/}
    backup-root: ${ZHUBAO_BACKUP_ROOT:}
    log-file: ${ZHUBAO_LOG_FILE:}
    backup-rpo-hours: ${ZHUBAO_BACKUP_RPO_HOURS:24}
