server:
  port: 8080

spring:
  application:
    name: zhubao-erp-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info

zhubao:
  m0:
    storage-mode: nas-first
    video-buffer-seconds: 5
    max-video-retry: 3
  documents:
    repository: memory
    storage:
      provider: local
      local-root: target/zhubao-evidence
  operations:
    frontend-url: ${ZHUBAO_FRONTEND_URL:http://localhost:5173/}
    frontend-probe-url: ${ZHUBAO_FRONTEND_PROBE_URL:}
    frontend-probe-timeout-ms: ${ZHUBAO_FRONTEND_PROBE_TIMEOUT_MS:800}
    backup-root: ${ZHUBAO_BACKUP_ROOT:}
    log-file: ${ZHUBAO_LOG_FILE:}
    backup-rpo-hours: ${ZHUBAO_BACKUP_RPO_HOURS:24}
    cos:
      enabled: ${ZHUBAO_COS_BACKUP_ENABLED:false}
      bucket: ${ZHUBAO_COS_BACKUP_BUCKET:}
      region: ${ZHUBAO_COS_BACKUP_REGION:}
      prefix: ${ZHUBAO_COS_BACKUP_PREFIX:}
      credentials-mode: ${ZHUBAO_COS_BACKUP_CREDENTIALS_MODE:}
      lifecycle-policy: ${ZHUBAO_COS_BACKUP_LIFECYCLE_POLICY:}
