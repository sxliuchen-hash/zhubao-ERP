  portion-inspection:
    repository: ${ZHUBAO_PORTION_INSPECTION_REPOSITORY:jdbc}
  portion-release:
    repository: ${ZHUBAO_PORTION_RELEASE_REPOSITORY:jdbc}
  rework-task:
    repository: ${ZHUBAO_REWORK_TASK_REPOSITORY:jdbc}
  outsourcing-source:
    repository: ${ZHUBAO_OUTSOURCING_SOURCE_REPOSITORY:jdbc}
  outsourcing-dispatch:
    repository: ${ZHUBAO_OUTSOURCING_DISPATCH_REPOSITORY:jdbc}
  outsourcing-return:
    repository: ${ZHUBAO_OUTSOURCING_RETURN_REPOSITORY:jdbc}
  outsourcing-completion:
    repository: ${ZHUBAO_OUTSOURCING_COMPLETION_REPOSITORY:jdbc}
  outsourcing-fee-basis:
    repository: ${ZHUBAO_OUTSOURCING_FEE_BASIS_REPOSITORY:jdbc}
  delivery-draft:
    repository: ${ZHUBAO_DELIVERY_DRAFT_REPOSITORY:jdbc}
  customer-return:
    repository: ${ZHUBAO_CUSTOMER_RETURN_REPOSITORY:jdbc}
  customer-delivery-bill:
    repository: ${ZHUBAO_CUSTOMER_DELIVERY_BILL_REPOSITORY:jdbc}
  public-delivery:
    repository: ${ZHUBAO_PUBLIC_DELIVERY_REPOSITORY:jdbc}
  factory-item:
    repository: ${ZHUBAO_FACTORY_ITEM_REPOSITORY:jdbc}
  company-material-receipt:
    repository: ${ZHUBAO_COMPANY_MATERIAL_RECEIPT_REPOSITORY:jdbc}
  company-material-issue:
    repository: ${ZHUBAO_COMPANY_MATERIAL_ISSUE_REPOSITORY:jdbc}
  consumable-adoption:
    repository: ${ZHUBAO_CONSUMABLE_ADOPTION_REPOSITORY:jdbc}
  consumable-cost:
    repository: ${ZHUBAO_CONSUMABLE_COST_REPOSITORY:jdbc}
  tool-custody:
    repository: ${ZHUBAO_TOOL_CUSTODY_REPOSITORY:jdbc}
  material-stocktake:
    repository: ${ZHUBAO_MATERIAL_STOCKTAKE_REPOSITORY:jdbc}
  fixed-asset-card:
    repository: ${ZHUBAO_FIXED_ASSET_CARD_REPOSITORY:jdbc}
  fixed-asset-acquisition:
    repository: ${ZHUBAO_FIXED_ASSET_ACQUISITION_REPOSITORY:jdbc}
  fixed-asset-custody:
    repository: ${ZHUBAO_FIXED_ASSET_CUSTODY_REPOSITORY:jdbc}
  fixed-asset-repair:
    repository: ${ZHUBAO_FIXED_ASSET_REPAIR_REPOSITORY:jdbc}
  fixed-asset-disposition:
    repository: ${ZHUBAO_FIXED_ASSET_DISPOSITION_REPOSITORY:jdbc}
  fixed-asset-stocktake:
    repository: ${ZHUBAO_FIXED_ASSET_STOCKTAKE_REPOSITORY:jdbc}
  sampling-order:
    repository: ${ZHUBAO_SAMPLING_ORDER_REPOSITORY:jdbc}
  sampling-version:
    repository: ${ZHUBAO_SAMPLING_VERSION_REPOSITORY:jdbc}
  sampling-material:
    repository: ${ZHUBAO_SAMPLING_MATERIAL_REPOSITORY:jdbc}
  sampling-operation:
    repository: ${ZHUBAO_SAMPLING_OPERATION_REPOSITORY:jdbc}
  sampling-delivery:
    repository: ${ZHUBAO_SAMPLING_DELIVERY_REPOSITORY:jdbc}
  sampling-fee:
    repository: ${ZHUBAO_SAMPLING_FEE_REPOSITORY:jdbc}
  sampling-production-link:
    repository: ${ZHUBAO_SAMPLING_PRODUCTION_LINK_REPOSITORY:jdbc}
  goldwork-order:
    repository: ${ZHUBAO_GOLDWORK_ORDER_REPOSITORY:jdbc}
  goldwork-material:
    repository: ${ZHUBAO_GOLDWORK_MATERIAL_REPOSITORY:jdbc}
  goldwork-movement:
    repository: ${ZHUBAO_GOLDWORK_MOVEMENT_REPOSITORY:jdbc}
  goldwork-recovery:
    repository: ${ZHUBAO_GOLDWORK_RECOVERY_REPOSITORY:jdbc}
  goldwork-supplement:
    repository: ${ZHUBAO_GOLDWORK_SUPPLEMENT_REPOSITORY:jdbc}
  goldwork-operation:
    repository: ${ZHUBAO_GOLDWORK_OPERATION_REPOSITORY:jdbc}
  goldwork-quality:
    repository: ${ZHUBAO_GOLDWORK_QUALITY_REPOSITORY:jdbc}
  goldwork-delivery:
    repository: ${ZHUBAO_GOLDWORK_DELIVERY_REPOSITORY:jdbc}
  master-data:
    repository: ${ZHUBAO_MASTER_DATA_REPOSITORY:jdbc}
  finance:
    repository: ${ZHUBAO_FINANCE_REPOSITORY:jdbc}
  gateway:
    repository: ${ZHUBAO_GATEWAY_REPOSITORY:jdbc}
    rate-limit:
      max-readings: ${ZHUBAO_GATEWAY_RATE_LIMIT_MAX:120}
      window-seconds: ${ZHUBAO_GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}
    replay:
      enabled: ${ZHUBAO_GATEWAY_REPLAY_ENABLED:true}
      window-seconds: ${ZHUBAO_GATEWAY_REPLAY_WINDOW_SECONDS:300}
  hardware:
    poc:
      repository: ${ZHUBAO_HARDWARE_POC_REPOSITORY:jdbc}
  auth:
    users:
      repository: ${ZHUBAO_AUTH_USERS_REPOSITORY:jdbc}
    audit:
      repository: ${ZHUBAO_AUTH_AUDIT_REPOSITORY:jdbc}
    pre-approval:
      repository: ${ZHUBAO_AUTH_PRE_APPROVAL_REPOSITORY:jdbc}
    account-action:
      repository: ${ZHUBAO_AUTH_ACCOUNT_ACTION_REPOSITORY:jdbc}
  operations:
    frontend-url: ${ZHUBAO_FRONTEND_URL:http://localhost/}
    frontend-probe-url: ${ZHUBAO_FRONTEND_PROBE_URL:http://frontend/}
    frontend-probe-timeout-ms: ${ZHUBAO_FRONTEND_PROBE_TIMEOUT_MS:800}
    backup-root: ${ZHUBAO_BACKUP_ROOT:}
    log-file: ${ZHUBAO_LOG_FILE:}
    restore-drill-max-age-hours: ${ZHUBAO_RESTORE_DRILL_MAX_AGE_HOURS:168}
    cos:
      enabled: ${ZHUBAO_COS_BACKUP_ENABLED:false}
      bucket: ${ZHUBAO_COS_BACKUP_BUCKET:}
      region: ${ZHUBAO_COS_BACKUP_REGION:}
      prefix: ${ZHUBAO_COS_BACKUP_PREFIX:}
      credentials-mode: ${ZHUBAO_COS_BACKUP_CREDENTIALS_MODE:}
      lifecycle-policy: ${ZHUBAO_COS_BACKUP_LIFECYCLE_POLICY:}
