spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${ZHUBAO_DB_URL:jdbc:mysql://localhost:3306/zhubao_erp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${ZHUBAO_DB_USERNAME:zhubao}
    password: ${ZHUBAO_DB_PASSWORD:}

zhubao:
  security:
    allow-header-context: ${ZHUBAO_ALLOW_HEADER_CONTEXT:false}
    menu:
      repository: ${ZHUBAO_MENU_REPOSITORY:jdbc}
    customer-authorization:
      repository: ${ZHUBAO_CUSTOMER_AUTHORIZATION_REPOSITORY:jdbc}
  inventory:
    repository: jdbc
  approval:
    repository: ${ZHUBAO_APPROVAL_REPOSITORY:memory}
  documents:
    repository: ${ZHUBAO_DOCUMENTS_REPOSITORY:memory}
    preview:
      require-explicit-secret: true
      secret: ${ZHUBAO_DOCUMENT_PREVIEW_SECRET:}
  scan-progress:
    repository: ${ZHUBAO_SCAN_PROGRESS_REPOSITORY:jdbc}
  command-request:
    repository: ${ZHUBAO_COMMAND_REQUEST_REPOSITORY:jdbc}
  register-import:
    repository: ${ZHUBAO_REGISTER_IMPORT_REPOSITORY:jdbc}
  machine-output:
    repository: ${ZHUBAO_MACHINE_OUTPUT_REPOSITORY:jdbc}
  machine-profile:
    repository: ${ZHUBAO_MACHINE_PROFILE_REPOSITORY:jdbc}
  label-template:
    repository: ${ZHUBAO_LABEL_TEMPLATE_REPOSITORY:jdbc}
  business-document:
    repository: ${ZHUBAO_BUSINESS_DOCUMENT_REPOSITORY:jdbc}
  whole-bag-report:
    repository: ${ZHUBAO_WHOLE_BAG_REPORT_REPOSITORY:jdbc}
  activity-bag:
    repository: ${ZHUBAO_ACTIVITY_BAG_REPOSITORY:jdbc}
